name: PR Default Tests

on:
  pull_request:

jobs:
  default-signtool-tests:
    runs-on: ${{ matrix.os }}
    env:
      term: xterm
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            file: dist/@lando/code-sign-action
          - os: macos-15
            file: /Users/runner/work/code-sign-action/code-sign-action/dist/@lando/code-sign-action
          - os: windows-2025
            file: dist\@lando\code-sign-action.exe
          - os: windows-2025
            file: D:\a\code-sign-action\code-sign-action/dist\@lando\code-sign-action.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        shell: bash
        run: npm ci --prefer-offline
      - name: Package node binary
        shell: bash
        run: npm run build
      - name: Trust Apple Developer ID test anchor on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # This intentionally trusts the Developer ID G2 issuer directly as an
          # ephemeral test anchor. The CA store lets Windows discover the issuer
          # and the Root store lets signtool stop there instead of validating
          # Apple's full production chain, which is outside this smoke test.
          # Do not import Apple Root CA here; that makes Windows build the full
          # Apple chain again and reintroduces the Developer ID G2 critical
          # extension failure this smoke test is intentionally bypassing.
          $certUrl = "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer"
          $certPath = "$env:TEMP\DeveloperIDG2CA.cer"
          $stores = @(
            "Cert:\LocalMachine\CA",
            "Cert:\LocalMachine\Root"
          )

          Invoke-WebRequest -Uri $certUrl -OutFile $certPath

          foreach ($store in $stores) {
            Import-Certificate -FilePath $certPath -CertStoreLocation $store | Out-Null
          }

          foreach ($store in $stores) {
            $trusted = @(Get-ChildItem $store |
              Where-Object { $_.Thumbprint -eq "5B45F61068B29FCC8FFFF1A7E99B78DA9E9C4635" })
            if ($trusted.Count -eq 0) {
              throw "Developer ID G2 certificate was not found in $store after import"
            }
            $trusted |
              Select-Object @{ Name = "Store"; Expression = { $store } }, Subject, Thumbprint, NotAfter
          }

      - name: Codesign
        id: code-sign-action
        uses: ./
        with:
          file: ${{ matrix.file }}
          certificate-data: ${{ secrets.APPLE_CERT_DATA }}
          certificate-id: 466VYKC9T5
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}
      - name: Test output
        shell: bash
        run: |
          echo "${{ steps.code-sign-action.outputs.file }}"
          stat "${{ steps.code-sign-action.outputs.file }}"
      - name: Execute file
        shell: bash
        run: chmod +x "${{ steps.code-sign-action.outputs.file }}" && "${{ steps.code-sign-action.outputs.file }}"
