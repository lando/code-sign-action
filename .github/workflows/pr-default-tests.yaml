name: PR Default Tests

on:
  pull_request:

jobs:
  default-signtool-tests:
    runs-on: ${{ matrix.os }}
    env:
      term: xterm
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            file: dist/@lando/code-sign-action
          - os: macos-15
            file: /Users/runner/work/code-sign-action/code-sign-action/dist/@lando/code-sign-action
          - os: windows-2025
            file: dist\@lando\code-sign-action.exe
          - os: windows-2025
            file: D:\a\code-sign-action\code-sign-action/dist\@lando\code-sign-action.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        shell: bash
        run: npm ci --prefer-offline
      - name: Package node binary
        shell: bash
        run: npm run build
      - name: Trust Apple signer test anchor on Windows
        if: runner.os == 'Windows'
        shell: powershell
        env:
          APPLE_CERT_DATA: ${{ secrets.APPLE_CERT_DATA }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          # This intentionally trusts the leaf signing certificate directly as
          # an ephemeral test anchor. The smoke test keeps signtool verify
          # enabled while avoiding the Apple Developer ID intermediate chain
          # that Windows cannot validate because of Apple's critical extension.
          $pfxPath = "$env:TEMP\apple-signer.p12"
          $certPath = "$env:TEMP\apple-signer.cer"
          $certPassword = ConvertTo-SecureString $env:APPLE_CERT_PASSWORD -AsPlainText -Force
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:APPLE_CERT_DATA))

          $importedCerts = @(Import-PfxCertificate -FilePath $pfxPath -Password $certPassword -CertStoreLocation "Cert:\LocalMachine\My")
          $signer = $importedCerts |
            Where-Object { $_.HasPrivateKey -and $_.Subject -like "*466VYKC9T5*" } |
            Select-Object -First 1
          if ($null -eq $signer) {
            throw "Could not find the expected Apple signer certificate in the imported PFX"
          }

          Export-Certificate -Cert $signer -FilePath $certPath | Out-Null
          Write-Output "Trusting Apple signer certificate directly:"
          $signer | Select-Object Subject, Issuer, Thumbprint, NotAfter
          $signer.Extensions |
            Select-Object @{ Name = "Oid"; Expression = { $_.Oid.Value } }, @{ Name = "Name"; Expression = { $_.Oid.FriendlyName } }, Critical

          $stores = @(
            "Cert:\LocalMachine\TrustedPeople",
            "Cert:\LocalMachine\TrustedPublisher",
            "Cert:\LocalMachine\Root"
          )

          foreach ($store in $stores) {
            Import-Certificate -FilePath $certPath -CertStoreLocation $store | Out-Null
          }

          foreach ($store in $stores) {
            $trusted = @(Get-ChildItem $store |
              Where-Object { $_.Thumbprint -eq $signer.Thumbprint })
            if ($trusted.Count -eq 0) {
              throw "Apple signer certificate was not found in $store after import"
            }
            $trusted |
              Select-Object @{ Name = "Store"; Expression = { $store } }, Subject, Thumbprint, NotAfter
          }

      - name: Codesign
        id: code-sign-action
        uses: ./
        with:
          file: ${{ matrix.file }}
          certificate-data: ${{ secrets.APPLE_CERT_DATA }}
          certificate-id: 466VYKC9T5
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}
      - name: Test output
        shell: bash
        run: |
          echo "${{ steps.code-sign-action.outputs.file }}"
          stat "${{ steps.code-sign-action.outputs.file }}"
      - name: Execute file
        shell: bash
        run: chmod +x "${{ steps.code-sign-action.outputs.file }}" && "${{ steps.code-sign-action.outputs.file }}"
