name: PR Default Tests

on:
  pull_request:

jobs:
  default-signtool-tests:
    runs-on: ${{ matrix.os }}
    env:
      term: xterm
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            file: dist/@lando/code-sign-action
          - os: macos-15
            file: /Users/runner/work/code-sign-action/code-sign-action/dist/@lando/code-sign-action
          - os: windows-2025
            file: dist\@lando\code-sign-action.exe
          - os: windows-2025
            file: D:\a\code-sign-action\code-sign-action/dist\@lando\code-sign-action.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        shell: bash
        run: npm ci --prefer-offline
      - name: Package node binary
        shell: bash
        run: npm run build
      - name: Trust Apple Developer ID test anchor on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # This intentionally trusts the Developer ID G2 issuer directly as an
          # ephemeral test root. The smoke test only needs Windows signtool to
          # verify the action's signing flow with the shared Apple cert; it is
          # not trying to model Apple's full production trust chain.
          $certs = @(
            @{
              Url   = "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer"
              Path  = "$env:TEMP\DeveloperIDG2CA.cer"
              Store = "Cert:\LocalMachine\Root"
            }
          )

          foreach ($cert in $certs) {
            Invoke-WebRequest -Uri $cert.Url -OutFile $cert.Path
            Import-Certificate -FilePath $cert.Path -CertStoreLocation $cert.Store | Out-Null
          }

          Get-ChildItem Cert:\LocalMachine\Root |
            Where-Object { $_.Subject -like "*Apple*" } |
            Select-Object Subject, Thumbprint, NotAfter

      - name: Codesign
        id: code-sign-action
        uses: ./
        with:
          file: ${{ matrix.file }}
          certificate-data: ${{ secrets.APPLE_CERT_DATA }}
          certificate-id: 466VYKC9T5
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}
      - name: Test output
        shell: bash
        run: |
          echo "${{ steps.code-sign-action.outputs.file }}"
          stat "${{ steps.code-sign-action.outputs.file }}"
      - name: Execute file
        shell: bash
        run: chmod +x "${{ steps.code-sign-action.outputs.file }}" && "${{ steps.code-sign-action.outputs.file }}"
