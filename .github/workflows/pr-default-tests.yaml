      #     # dump
      #     If (!(Test-Path $cert_path)) {
      #       Write-Output "Dumping cert to $cert_path..."
      #       $bytes = [Convert]::FromBase64String($cert_data)
      #       [IO.File]::WriteAllBytes($cert_path, $bytes)
      #     }

      #     # trust
      #     Import-PfxCertificate -FilePath $cert_path -CertStoreLocation $cert_store -Password $cert_secure_password
      - name: Trust Apple Developer ID chain on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $certs = @(
            @{
              Url   = "https://www.apple.com/appleca/AppleIncRootCertificate.cer"
              Path  = "$env:TEMP\AppleIncRootCertificate.cer"
              Store = "Cert:\LocalMachine\Root"
            },
            @{
              Url   = "https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer"
              Path  = "$env:TEMP\DeveloperIDG2CA.cer"
              Store = "Cert:\LocalMachine\CA"
            }
          )

          foreach ($cert in $certs) {
            Invoke-WebRequest -Uri $cert.Url -OutFile $cert.Path
            Import-Certificate -FilePath $cert.Path -CertStoreLocation $cert.Store | Out-Null
          }

          Get-ChildItem Cert:\LocalMachine\Root, Cert:\LocalMachine\CA |
            Where-Object { $_.Subject -like "*Apple*" } |
            Select-Object Subject, Thumbprint, NotAfter

      - name: Codesign
        id: code-sign-action
        uses: ./
        with:
          file: ${{ matrix.file }}
          certificate-data: ${{ secrets.APPLE_CERT_DATA }}
          certificate-id: 466VYKC9T5
          certificate-password: ${{ secrets.APPLE_CERT_PASSWORD }}
      - name: Test output
        shell: bash
        run: |
          echo "${{ steps.code-sign-action.outputs.file }}"
          stat "${{ steps.code-sign-action.outputs.file }}"
      - name: Execute file
        shell: bash
        run: chmod +x "${{ steps.code-sign-action.outputs.file }}" && "${{ steps.code-sign-action.outputs.file }}"
